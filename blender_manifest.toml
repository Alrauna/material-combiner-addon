schema_version = "1.0.0"

id = "shotariyas_material_combiner"
version = "3.1.0"
name = "Shotariya's Material Combiner"
tagline = "Advanced texture atlas generation system for optimized rendering"
maintainer = "Alrauna <67886220+Alrauna@users.noreply.github.com>"
type = "add-on"

blender_version_min = "5.2.0"

platforms = [
  "windows-x64",
]

wheels = [
  "./wheels/pillow-12.3.0-cp313-cp313-win_amd64.whl",
]

license = [
  "SPDX:MIT",
]

website = "https://github.com/Alrauna/material-combiner-addon"

tags = [
  "Material",
  "UV",
]

# Required permissions for the addon
[permissions]
files = "Import/export texture atlases and manage external files"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.py[cod]",
  "*$py.class",
  ".*",
  "*.so",
  "build/",
  "develop-eggs/",
  "dist/",
  "downloads/",
  "eggs/",
  "lib/",
  "lib64/",
  "parts/",
  "sdist/",
  "var/",
  "*.egg-info/",
  "*.egg",
  "MANIFEST",
  "*.manifest",
  "*.spec",
  "*.zip",
  "pip-log.txt",
  "pip-delete-this-directory.txt",
  "htmlcov/",
  "nosetests.xml",
  "coverage.xml",
  "*.cover",
  "*.mo",
  "*.pot",
  "*.log",
  "local_settings.py",
  "db.sqlite3",
  "instance/",
  "docs/_build/",
  "target/",
  "celerybeat-schedule",
  "*.sage.py",
  "env/",
  "venv/",
  "ENV/",
  "env.bak/",
  "venv.bak/",
  "*.env",
  "/site/",
  "material-combiner-addon_updater/",
  "BLENDER_5_0_COMPATIBILITY_ANALYSIS.md",
  "tests/",
  "AGENTS.md",
  "CLAUDE.md",
  "docs/",
]
