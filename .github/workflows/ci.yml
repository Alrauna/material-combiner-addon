name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish a release. Leave empty to only run validation.
          Must be X.Y.Z and match addon/blender_manifest.toml.
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: CI / ${{ matrix.label }} — Blender 5.2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            label: Windows
            platform: windows
          - runner: ubuntu-24.04
            label: Linux
            platform: linux
          # Apple Silicon. Blender 5.2 ships no macOS Intel build, so there
          # is no x64 counterpart to test.
          - runner: macos-15
            label: macOS
            platform: macos
    steps:
      # Actions are pinned by commit, not tag, so a moved tag cannot change
      # what runs. actions/checkout v7.0.1.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The atlas undo and repeatability check needs a real window. Without a
      # display it reports that it needs a foreground context and never runs.
      - name: Install a virtual framebuffer
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Verify and extract Blender 5.2.0
        id: blender
        shell: bash
        run: >-
          python tools/ci.py prepare-blender
          --platform '${{ matrix.platform }}'
          --output-dir '${{ runner.temp }}/blender'
          --github-output "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: '"${{ steps.blender.outputs.python }}" -m unittest discover -s tests/unit -p "test_*.py" -v'

      - name: Verify bundled wheels
        shell: bash
        run: '"${{ steps.blender.outputs.python }}" tools/verify_dependency_wheel.py'

      - name: Validate extension source
        shell: bash
        run: '"${{ steps.blender.outputs.blender }}" --factory-startup --command extension validate addon'

      - name: Run source-tree suites
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          run_suite () {
            local name="$1"; shift
            echo "::group::source suite: $name"
            python tests/run_tests.py \
              --blender "${{ steps.blender.outputs.blender }}" \
              --work "${{ runner.temp }}/work-$name" \
              source "$@"
            echo "::endgroup::"
          }
          run_suite public-api  --script tests/blender/verify_public_api.py         --result r.json
          run_suite ui          --script tests/blender/verify_blender52_ui.py       --result r.json
          run_suite lifecycle   --script tests/blender/verify_atomic_lifecycle.py   --result r.json
          run_suite preflight   --script tests/blender/verify_preflight_failures.py --result r.json
          run_suite dep-absent  --script tests/blender/verify_dependency_absent.py  --result r.json --exclude-wheel

      # Foreground needs a real window. Under xvfb that works and the undo and
      # repeatability check actually runs. A Windows runner has no interactive
      # desktop: Blender opens a window and blocks forever, so the atlas suite
      # runs in background there and the undo check reports that it was
      # skipped. That check is therefore covered on Linux only.
      - name: Run the atlas suite (foreground, undo covered)
        if: matrix.platform == 'linux'
        timeout-minutes: 20
        shell: bash
        run: >-
          python tests/run_tests.py
          --blender "${{ steps.blender.outputs.blender }}"
          --work "${{ runner.temp }}/work-atlas"
          source --script tests/blender/verify_atlas_workflows.py
          --result r.json --foreground

      # macOS has no xvfb, and a runner has no window server to attach to, so
      # foreground is not available here either.
      - name: Run the atlas suite (background)
        if: matrix.platform != 'linux'
        timeout-minutes: 20
        shell: bash
        run: >-
          python tests/run_tests.py
          --blender "${{ steps.blender.outputs.blender }}"
          --work "${{ runner.temp }}/work-atlas"
          source --script tests/blender/verify_atlas_workflows.py
          --result r.json

      # Regression cover for the Windows extended-length path handling. The
      # extension root must stay under MAX_PATH while files inside exceed it;
      # see tests/README.md before changing the padding.
      - name: Run the long-path suite
        if: matrix.platform == 'windows'
        timeout-minutes: 20
        shell: bash
        run: >-
          python tests/run_tests.py
          --blender "${{ steps.blender.outputs.blender }}"
          --work "${{ runner.temp }}/work-longpath"
          source --script tests/blender/verify_atlas_workflows.py
          --result r.json --long-path

      - name: Build the extension
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/release"
          "${{ steps.blender.outputs.blender }}" --factory-startup \
            --command extension build --source-dir addon \
            --output-dir "${{ runner.temp }}/release"
          archive=$(ls "${{ runner.temp }}"/release/*.zip)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "built $archive"

      - name: Validate the built package
        shell: bash
        run: '"${{ steps.blender.outputs.blender }}" --factory-startup --command extension validate "${{ steps.build.outputs.archive }}"'

      - name: Run installed-package suites
        shell: bash
        run: |
          set -euo pipefail
          run_pkg () {
            local name="$1"; shift
            echo "::group::package suite: $name"
            python tests/run_tests.py \
              --blender "${{ steps.blender.outputs.blender }}" \
              --work "${{ runner.temp }}/pkg-$name" \
              --drive-letter O \
              package --package "${{ steps.build.outputs.archive }}" "$@"
            echo "::endgroup::"
          }
          run_pkg dependency --script tests/blender/verify_packaged_dependency.py --result r.json
          run_pkg public-api --script tests/blender/verify_public_api.py          --result r.json
          run_pkg atlas      --script tests/blender/verify_atlas_workflows.py     --result r.json

      # --strict: locally, CATS drift only warns so developers are not blocked.
      # Here the archive is executed on a runner, and the pin is the only
      # integrity control, so drift must stop the build.
      - name: Fetch and verify CATS
        id: cats
        shell: bash
        run: >-
          python tools/fetch_cats.py
          --output-dir '${{ runner.temp }}/cats' --strict
          --github-output "$GITHUB_OUTPUT"

      # The CATS path derives from a remote release asset name, so it reaches
      # the shell through the environment rather than being interpolated into
      # the command, where a crafted value could break out of the quoting.
      - name: Run the CATS checkpoint
        shell: bash
        env:
          BLENDER: ${{ steps.blender.outputs.blender }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
          CATS_EXTENSION: ${{ steps.cats.outputs.extension }}
          CATS_SHA256: ${{ steps.cats.outputs.extension_sha256 }}
        run: >-
          python tests/run_tests.py
          --blender "$BLENDER"
          --work "${{ runner.temp }}/checkpoint"
          --drive-letter N
          checkpoint --package "$ARCHIVE"
          --cats "$CATS_EXTENSION"
          --cats-sha256 "$CATS_SHA256"

      # Uploaded on success too. A green run otherwise cannot show whether the
      # undo check ran or reported itself skipped, which is exactly the
      # distinction the foreground handling exists to make.
      # actions/upload-artifact v4.6.2.
      - name: Upload suite results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ matrix.label }}
          path: ${{ runner.temp }}/**/profile/results/**
          retention-days: 7
          if-no-files-found: ignore

  # Checks the requested version before anything is built, so a mismatch
  # fails in seconds rather than after a full validation run.
  release_gate:
    name: Release input gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release != '' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require the manifest to declare this version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release }}
        run: >-
          python tools/ci.py check-release
          --version "$RELEASE_VERSION"
          --manifest addon/blender_manifest.toml

  release:
    name: Publish verified release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release != '' &&
      github.ref == 'refs/heads/master'
    needs: [validate, release_gate]
    runs-on: windows-2025
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.release }}
    steps:
      # Fetch the exact commit with no credentials, rather than checking out
      # with a token, so the release is built from public source and the
      # build cannot quietly use a different tree.
      - name: Fetch the exact public source
        shell: bash
        env:
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$SOURCE_REPOSITORY"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$SOURCE_SHA" ]; then
            echo "checked out $actual, expected $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Verify and extract Blender 5.2.0
        id: blender
        shell: bash
        run: >-
          python tools/ci.py prepare-blender
          --platform windows
          --output-dir '${{ runner.temp }}/blender'
          --github-output "$GITHUB_OUTPUT"

      - name: Build the release archives
        shell: bash
        env:
          BLENDER: ${{ steps.blender.outputs.blender }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/release"
          "$BLENDER" --factory-startup --command extension build \
            --source-dir addon --output-dir "${{ runner.temp }}/release"
          "$BLENDER" --factory-startup --command extension build \
            --source-dir addon --output-dir "${{ runner.temp }}/release" \
            --split-platforms

      - name: Validate every archive
        shell: bash
        env:
          BLENDER: ${{ steps.blender.outputs.blender }}
        run: |
          set -euo pipefail
          for archive in "${{ runner.temp }}"/release/*.zip; do
            echo "::group::validate $(basename "$archive")"
            "$BLENDER" --factory-startup --command extension validate "$archive"
            echo "::endgroup::"
          done

      - name: Compute the release identity and checksums
        id: release
        shell: bash
        run: >-
          python tools/ci.py prepare-release
          --version "$RELEASE_VERSION"
          --manifest addon/blender_manifest.toml
          --release-dir '${{ runner.temp }}/release'
          --checksum-output '${{ runner.temp }}/release/SHA256SUMS.txt'
          --github-output "$GITHUB_OUTPUT"

      - name: Refuse an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 1
          fi

      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh release create "$TAG" --repo "${{ github.repository }}"
          --draft --generate-notes --title "$TAG"
          --target "${{ github.sha }}"

      - name: Upload the archives and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "${{ github.repository }}" \
            "${{ runner.temp }}"/release/*.zip \
            "${{ runner.temp }}/release/SHA256SUMS.txt"

      # Verify what the release actually stores, not what was uploaded. A
      # draft that fails this is never published.
      - name: Download and verify the stored archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVES: ${{ steps.release.outputs.archives }}
        run: |
          set -euo pipefail
          stored="${{ runner.temp }}/stored"
          mkdir -p "$stored"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern '*.zip' --dir "$stored"
          for name in $ARCHIVES; do
            expected=$(awk -v n="$name" '$2 == n {print $1}' \
              "${{ runner.temp }}/release/SHA256SUMS.txt")
            if [ -z "$expected" ]; then
              echo "no checksum recorded for $name" >&2
              exit 1
            fi
            python tools/ci.py verify-file \
              --file "$stored/$name" --expected-sha256 "$expected"
          done

      - name: Publish the verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh release edit "$TAG" --repo "${{ github.repository }}"
          --draft=false
